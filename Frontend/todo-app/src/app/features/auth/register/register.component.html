<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow" style="width: 400px;">
    <div class="card-body p-4">

      <!-- Header -->
      <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">ToDo App</h2>
        <p class="text-muted">Створіть акаунт</p>
      </div>

      <!-- Error -->
      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <!-- Form -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="row mb-3">
          <div class="col">
            <label class="form-label">Ім'я</label>
            <input
              type="text"
              class="form-control"
              formControlName="firstName"
              placeholder="Аліна"
              [class.is-invalid]="form.get('firstName')?.invalid && form.get('firstName')?.touched">
            <div class="invalid-feedback">Введіть ім'я</div>
          </div>
          <div class="col">
            <label class="form-label">Прізвище</label>
            <input
              type="text"
              class="form-control"
              formControlName="lastName"
              placeholder="Сучок"
              [class.is-invalid]="form.get('lastName')?.invalid && form.get('lastName')?.touched">
            <div class="invalid-feedback">Введіть прізвище</div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            formControlName="email"
            placeholder="email@gmail.com"
            [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched">
          <div class="invalid-feedback">Введіть коректний email</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input
            type="password"
            class="form-control"
            formControlName="password"
            placeholder="********"
            [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched">
          <div class="invalid-feedback">Мінімум 6 символів</div>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 mb-3"
          [disabled]="isLoading">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
          {{ isLoading ? 'Реєстрація...' : 'Зареєструватись' }}
        </button>

        <p class="text-center text-muted mb-0">
          Вже є акаунт?
          <a routerLink="/login" class="text-primary">Увійти</a>
        </p>
      </form>

    </div>
  </div>
</div>
