<div *ngIf="isVisible"
     class="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center"
     style="background:rgba(0,0,0,0.5); z-index:2000;">

  <div class="bg-white rounded-3 shadow p-4 mx-3" style="max-width:340px; width:100%;">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h6 class="fw-bold mb-0">{{ title }}</h6>
      <button class="btn btn-link text-decoration-none p-0 shadow-none border-0 d-flex align-items-center"
              (click)="cancelled.emit()">
        <span class="material-symbols-outlined" style="font-size:20px;">close</span>
      </button>
    </div>

    <!-- Message -->
    <p class="text-muted small mb-4">{{ message }}</p>

    <!-- Buttons -->
    <div class="d-flex flex-column gap-2">
      <button class="btn btn-danger w-100" (click)="confirmed.emit()">
        {{ confirmText }}
      </button>
      <button class="btn btn-outline-secondary w-100" (click)="cancelled.emit()">
        Скасувати
      </button>
    </div>

  </div>
</div>
